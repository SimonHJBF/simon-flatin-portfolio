# Netlify publishes the repo root, so the build inputs below would otherwise be
# downloadable. None of them is linked from the site. They answer 404 instead;
# force = true is what makes a rule win over a file that exists.
[[redirects]]
  from = "/build.js"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/.gitignore"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/.claude/*"
  to = "/404"
  status = 404
  force = true

# The text sources behind the About, start and Services pages.
[[redirects]]
  from = "/content/about/bio.txt"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/content/about/cv.txt"
  to = "/404"
  status = 404
  force = true

[[redirects]]
