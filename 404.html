<!DOCTYPE html>

<head>

  <title>Page not found &middot; Simon H.J. Bj&oslash;rk&aring; Flatin</title>
  <link rel="stylesheet" href="/style.css" />
  <style>
    .notfound { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1.2rem; padding:2rem; text-align:center; }
    .notfound h1 { font-family:var(--serif); font-weight:400; font-size:clamp(1.8rem,3vw,2.4rem); }
    .notfound p { color:var(--muted); font-size:.95rem; line-height:1.7; }
    .notfound a { color:var(--dark); font-size:.78rem; letter-spacing:.16em; text-transform:uppercase; text-decoration:none; border-bottom:1px solid var(--dark); }
  </style>
</head>
<body>
  <main class="notfound">
    <h1>Page not found</h1>

</body>
</html>
